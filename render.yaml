# Render Blueprint for a FREE public demo.
#
# One free web service runs the gateway and the stand-in app together
# (scripts/start-demo-stack.js), with the app bound to loopback so the gateway
# is the only way to reach it. Postgres lives on Neon's free plan. Neither
# needs a card.
#
# This is demo-shaped, not the VPN deployment in DEPLOY.md: the free service
# sleeps after 15 minutes without traffic and takes about a minute to wake, so
# open the URL a few minutes before a pitch.

services:
  - type: web
    name: temp-access-gateway
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerCommand: node scripts/start-demo-stack.js
    plan: free
    region: singapore
    # One process, always: the grant-status cache and rate limiters live in
    # memory (README, "Deliberate constraints").
    numInstances: 1
    # Readiness includes Postgres, so an instance that cannot reach the
    # database is not sent traffic.
    healthCheckPath: /__access/health/ready
    autoDeployTrigger: commit
    envVars:
      # The Neon connection string, pasted during setup. Keep ?sslmode=require
      # on it: certificates are verified either way.
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_SSL
        value: "true"
      # Generated by Render and never shown in this file or the repo.
      - key: JWT_SECRET
        generateValue: true
      - key: UPSTREAM_SHARED_SECRET
        generateValue: true
      # Render's proxy sits in front; this makes rate limits and the audit log
      # see each visitor's own address.
      - key: TRUST_PROXY
        value: "true"
      # Optional. Left blank, grants still work and the console shows the
      # password to relay by hand.
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
